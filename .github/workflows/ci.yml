# CI — the compatibility matrix the blueprint promises (§8): portable suites
# run against every relational backend; dialect suites run against their own
# database; module boundaries gate the build before any test executes.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Blueprint §4: a boundary violation "fails the build before tests even
  # run" — hence a standalone job every other job depends on.
  boundary:
    name: Module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Enforce module import boundaries
        run: fastplace lint:modules

  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e ./packages/tenancy

      - name: Ruff lint
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy fastplace packages/tenancy/src

  backend:
    name: Backend matrix
    needs: boundary
    runs-on: ubuntu-latest
    # pyproject ships 3.12 + 3.13 classifiers — the suite runs on both so
    # every classifier is a verified claim, not a hope. fail-fast off: a
    # 3.12-only failure must not mask whether 3.13 also breaks.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        # pgvector image: the PostgreSQL dialect suite exercises real
        # VECTOR columns, which need the extension pre-installed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fastplace
          POSTGRES_PASSWORD: fastplace
          POSTGRES_DB: fastplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fastplace_test
          MYSQL_USER: fastplace
          MYSQL_PASSWORD: fastplace
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The redis integration lane (real saq worker + real pub/sub fan-out)
      # socket-probes localhost:6379 and skips when silent — presence of the
      # broker is the only switch it reads, no env URL. Tests self-isolate
      # on DB index 11 with per-test fftest- namespaces and never FLUSH.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://fastplace:fastplace@localhost:5432/fastplace_test
      TEST_MYSQL_URL: mysql://fastplace:fastplace@localhost:3306/fastplace_test
      TEST_MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (all database extras)
        run: |
          python -m pip install -e ".[dev,postgresql,mysql,mongodb,queue,s3]"
          python -m pip install -e ./packages/tenancy

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (lockfile is npm-11-generated)
        run: npm install -g npm@11.19.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build @fastplace/react (scaffold file wiring needs dist/)
        run: npm run build -w packages/react

      - name: Enable pgvector extension
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg

          async def main() -> None:
              conn = await asyncpg.connect(dsn="${{ env.TEST_POSTGRES_URL }}")
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Run test suite (portable matrix + dialect suites)
        run: python -m pytest -q

  frontend:
    name: Frontend
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm (lockfile is npm-11-generated)
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: npm ci

      # Supply-chain gate, npm half. --audit-level=high is the scoping:
      # moderate advisories in dev-only tooling must not block the build;
      # high and above anywhere in the installed tree must.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: Types (tsc)
        run: npm run types

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test:run

      - name: Docs site build
        run: npm run docs:build

  supply-chain:
    name: Supply chain (wheel + deps audit)
    needs: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Audit what we SHIP, not what we develop with: the built wheel goes
      # into a clean venv and pip-audit weighs that resolved tree. The tool
      # install gets retries (an index hiccup is not a vulnerability);
      # --strict then makes any collection failure fatal, and any known
      # vulnerability in the shipped tree fails the gate.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --upgrade pip
          /tmp/audit/bin/pip install dist/fastplace-*.whl

      - name: Install pip-audit
        run: python -m pip install --retries 5 pip-audit

      - name: Audit the wheel's resolved dependencies
        run: |
          /tmp/audit/bin/pip freeze > /tmp/wheel-freeze.txt
          pip-audit --strict --no-deps --requirement /tmp/wheel-freeze.txt

  e2e:
    name: Playwright E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Pin npm (lockfile is npm-11-generated)
        run: npm install -g npm@11.19.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test

  release-smoke:
    name: Release smoke (wheel boots a fresh app)
    needs: [boundary, backend]
    runs-on: ubuntu-latest
    # The wheel is built per supported python — a 3.13-only packaging or
    # runtime break must surface here, before PyPI, on both classifiers.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The release gate: everything below runs against the BUILT wheel, never
      # the checkout — the exact artifact `twine upload` would ship. A wheel the
      # starter kit cannot boot from fails here, before PyPI, not in a user's
      # terminal after install.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/fastplace-*.whl
          # Prove fastplace resolves from the smoke venv, not the checkout —
          # run from /tmp so the repo's own fastplace/ dir cannot shadow it.
          cd /tmp
          /tmp/smoke/bin/python -c 'import fastplace, pathlib; p = pathlib.Path(fastplace.__file__).resolve(); assert "/tmp/smoke" in str(p), p'

      - name: Scaffold an app from the installed artifact
        run: |
          mkdir /tmp/appdir
          cd /tmp/appdir
          /tmp/smoke/bin/fastplace new demo --auth --no-install

      # The scaffolded pyproject pins fastplace>=<this release>, which the
      # wheel already installed above satisfies — so this editable install
      # never re-resolves fastplace from PyPI. It pulls only the app's own
      # deps (email-validator, the queue/webauthn extras, the dev suite),
      # exactly what a real user's `fastplace new` installs for them.
      - name: Install the scaffolded app's dependencies
        run: |
          cd /tmp/appdir/demo
          /tmp/smoke/bin/pip install -e ".[dev]"

      - name: Boot the scaffolded app
        run: |
          cd /tmp/appdir/demo
          /tmp/smoke/bin/python -c "from asgi import app; print('ROUTES', len(app.routes))"

      - name: Run the scaffolded app's emitted test suite
        run: |
          cd /tmp/appdir/demo
          /tmp/smoke/bin/python -m pytest -q
