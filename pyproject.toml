[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fastplace"
version = "0.2.0"
description = "Fastplace — an opinionated, full-stack, AI-native web framework built on Python and React, focused on a productive developer experience."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Firoz Anam" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "itsdangerous>=2.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=42",
    "python-multipart>=0.0.18",
]

[project.urls]
Homepage = "https://fastplace.dev"
Repository = "https://github.com/fastplace-dev/fastplace.dev"
Issues = "https://github.com/fastplace-dev/fastplace.dev/issues"
Changelog = "https://github.com/fastplace-dev/fastplace.dev/releases"

[project.optional-dependencies]
testing = ["freezegun>=1.5"]
postgresql = ["asyncpg>=0.29", "pgvector>=0.3"]
mysql = ["asyncmy>=0.2.9", "cryptography>=42"]
mongodb = ["pymongo>=4.9"]
mail = ["aiosmtplib>=3.0"]
ai = ["litellm>=1.50", "instructor>=1.6"]
pwdlib = ["pwdlib[argon2]>=0.2"]
queue = ["saq>=0.18", "redis>=5.0"]
webauthn = ["webauthn>=2.6"]
all = [
    "asyncpg>=0.29", "pgvector>=0.3",
    "asyncmy>=0.2.9", "cryptography>=42",
    "pymongo>=4.9",
    "aiosmtplib>=3.0",
    "litellm>=1.50", "instructor>=1.6",
    "saq>=0.18", "redis>=5.0",
    "webauthn>=2.6",
    "freezegun>=1.5",
]
dev = [
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "mypy>=1.13",
    "ruff>=0.7",
    "build>=1.2",
    "twine>=6.1",
    "email-validator>=2.0",
    "webauthn>=2.6",
]

[project.scripts]
fastplace = "fastplace.cli:app"

[project.entry-points.pytest11]
fastplace_testing = "fastplace.testing.plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fastplace*"]

# Non-Python files the installed package needs at runtime: `fastplace new`
# and `migrate` copy the Alembic env/script templates out of site-packages —
# a wheel without them crashes the first-run onboarding path.
[tool.setuptools.package-data]
"fastplace.orm.migrations" = ["templates/*.tpl", "templates/*.mako"]
# The dotfile pattern matters: glob "*" never matches .editorconfig, and an
# installed `fastplace new` would silently ship a starter without it.
"fastplace.cli" = ["scaffold_templates/**/*", "scaffold_templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/tenancy/src"]
# importlib mode: test modules keep their real file identity — the default
# prepend mode top-levels bare basenames, so two suites shipping the same
# filename (logging/test_context.py vs tenancy/test_context.py) collide the
# moment both collect in one process.
addopts = "--import-mode=importlib"
markers = ["slow: long-running build-gate tests (npm install + vite build)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The repo suite manages its own databases per fixture (tmp sqlite files,
# engine swaps) — the plugin's session pin would be redundant here. Scaffolded
# apps get "auto" (the default) and never see their real database in tests.
fastplace_test_database = "off"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["database/migrations/versions", "storage"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated Alembic revisions are machine-written (like mypy's exclusion above).
exclude = ["database/migrations/versions", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["fastplace"]
branch = true
omit = [
    "storage/*",
    "database/migrations/versions/*",
]

[tool.coverage.report]
precision = 1
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
