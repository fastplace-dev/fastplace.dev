[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fastplace"
version = "0.1.0"
description = "Fastplace — an opinionated, full-stack, AI-native web framework built on Python and React, focused on a productive developer experience."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Firoz Anam" }]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "itsdangerous>=2.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.18",
]

[project.urls]
Homepage = "https://fastplace.dev"
Repository = "https://github.com/firozanam/fastplace.dev"
Issues = "https://github.com/firozanam/fastplace.dev/issues"
Changelog = "https://github.com/firozanam/fastplace.dev/releases"

[project.optional-dependencies]
postgresql = ["asyncpg>=0.29", "pgvector>=0.3"]
mysql = ["asyncmy>=0.2.9", "cryptography>=42"]
mongodb = ["pymongo>=4.9"]
mail = ["aiosmtplib>=3.0"]
ai = ["litellm>=1.50", "instructor>=1.6"]
pwdlib = ["pwdlib[argon2]>=0.2"]
queue = ["saq>=0.18", "redis>=5.0"]
all = [
    "asyncpg>=0.29", "pgvector>=0.3",
    "asyncmy>=0.2.9", "cryptography>=42",
    "pymongo>=4.9",
    "aiosmtplib>=3.0",
    "litellm>=1.50", "instructor>=1.6",
    "saq>=0.18", "redis>=5.0",
]
dev = [
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
fastplace = "fastplace.cli:app"

[tool.setuptools.packages.find]
include = ["fastplace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["database/migrations/versions", "storage"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated Alembic revisions are machine-written (like mypy's exclusion above).
exclude = ["database/migrations/versions", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]
